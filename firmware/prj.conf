CONFIG_NCS_SAMPLES_DEFAULTS=y

# Deferred logging helps improve LPN power consumption
# when friendship is established.
CONFIG_LOG_MODE_DEFERRED=y

# General configuration
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="MeshyQ"
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_SETTINGS_NVS_NAME_CACHE=y
CONFIG_HWINFO=y
CONFIG_GPIO=y
CONFIG_SPI=y

# The board default USB identity ("Zephyr Project" / "CDC ACM serial
# backend") is a compile-time-fixed string, so it can't include a per-chip
# hardware UID. Disable it in favor of src/usb_id.c, which builds an
# equivalent USB device but names it "MeshyQ <hex UID>" so each node in the
# fleet is distinguishable on the host.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Structured JSON control protocol for the web app (src/web_api.c), on its
# own second CDC-ACM interface (web_api_cdc_acm_uart, boards/*.overlay).
CONFIG_JSON_LIBRARY=y

# SD card (Music Maker FeatherWing) storage
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# The audio player thread reads files from the SD card while other
# threads (shell commands, mesh message handlers) can concurrently stat
# or list files on the same volume. Without this, FatFs volume access
# isn't mutex-protected across threads.
CONFIG_FS_FATFS_REENTRANT=y

# Bluetooth configuration
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="MeshyQ"
CONFIG_BT_L2CAP_TX_BUF_COUNT=16
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SETTINGS=y

# Disable unused Bluetooth features
CONFIG_BT_CTLR_LE_ENC=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_CTLR_CHAN_SEL_2=n
CONFIG_BT_CTLR_MIN_USED_CHAN=n
CONFIG_BT_CTLR_PRIVACY=n

# Bluetooth Mesh configuration
CONFIG_BT_MESH=y
# Every node relays. At the ~13-node scale of this deployment that's the
# right call, not a problem to thin out: the common advice to limit relays
# to a small percentage of nodes is aimed at large (100s of nodes) dense
# lighting-style deployments where redundant relaying causes collision
# storms. A fleet this size needs full relay coverage for connectivity.
CONFIG_BT_MESH_RELAY=y
CONFIG_BT_MESH_FRIEND=y

# Reliability tuning for a sparse-traffic, ~13-node fleet: with infrequent
# messages there's no "the next one will probably get through" luck, so
# each send needs its own redundancy.
#   - Relays forward each packet exactly once by default (retransmit count
#     0). That's the single biggest reliability gap for multi-hop delivery:
#     losing one over-the-air transmission at any hop loses the message
#     outright. Retransmitting twice per hop closes that gap.
#   - The originating node repeats its own first transmission one extra
#     time beyond the default, for the same reason on the first hop.
#   - The replay-protection list (CRPL) defaults to 10 entries, which is
#     under the node count; it should exceed the number of nodes with some
#     margin (entries are cheap, ~64 B each).
CONFIG_BT_MESH_RELAY_RETRANSMIT_COUNT=2
CONFIG_BT_MESH_NETWORK_TRANSMIT_COUNT=3
CONFIG_BT_MESH_CRPL=16

# Mesh buffer and segment configuration (fixes "Unable to allocate loopback")
CONFIG_BT_MESH_LOOPBACK_BUFS=8
CONFIG_BT_MESH_RX_SEG_MAX=16
CONFIG_BT_MESH_TX_SEG_MAX=16
CONFIG_BT_MESH_TX_SEG_MSG_COUNT=4

# The default of 1 only lets a node reassemble one incoming segmented
# message at a time. Every message this app sends is segmented (its max
# length is far above the ~11-byte unsegmented limit), and "cue list"
# makes every node in the ~13-node fleet reply with its own segmented
# message, unicast straight back to whichever node asked -- so that node
# needs to reassemble a whole fleet's worth of concurrent segmented
# replies at once, not just one. 16 matches the same fleet-size-plus-
# margin headroom already used above for RX_SEG_MAX/TX_SEG_MAX/CRPL.
# Each slot's exact RAM cost isn't a published constant; if a build ever
# reports insufficient RAM, this is the first value to turn back down.
CONFIG_BT_MESH_RX_SEG_MSG_COUNT=16

# Extra relay/advertising buffer headroom for the retransmit counts above:
# more retransmitted copies are in flight per message now, and this project
# has already hit one real "Unable to allocate" bug (see LOOPBACK_BUFS)
# from underestimating buffer needs.
CONFIG_BT_MESH_RELAY_BUF_COUNT=16
CONFIG_BT_MESH_ADV_BUF_COUNT=10

CONFIG_BT_MESH_PB_GATT=y
CONFIG_BT_MESH_GATT_PROXY=y
CONFIG_BT_MESH_CFG_CLI=y

# Enable Bluetooth Mesh models debug logs
CONFIG_BT_MESH_LOG_LEVEL_DBG=y

# Enable Shell module and use UART as a backend
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_FLASH_SHELL=n

# sys_reboot(), used by the "bootloader" shell command (src/bootloader.c)
CONFIG_REBOOT=y

CONFIG_LOG_BACKEND_RTT=n

# Defensive sizing learned the hard way during hardware bring-up: the
# default main stack (1024B) and heap (0B) are too small once SD/FAT and
# Bluetooth Mesh are both in play, and previously caused a hard-to-diagnose
# crash severe enough to prevent USB enumeration. Audio/SD/VS1053 bring-up
# now runs on its own thread (see audio_player.c) with its own 4096B stack,
# but this still gives bt_ready()'s own Bluetooth/mesh init path headroom.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# So a stack overflow shows up as a clear fault message instead of a
# silent crash/reset.
CONFIG_HW_STACK_PROTECTION=y
