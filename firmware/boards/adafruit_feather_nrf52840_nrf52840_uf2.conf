# Without this, Zephyr ignores the board's devicetree partition layout
# (code_partition @ 0x26000, clear of the Adafruit bootloader/SoftDevice
# region at 0x0-0x26000) and links the app at address 0 instead. Flashing
# that via the UF2 bootloader overwrites the bootloader itself and bricks
# the board (rapid red LED, no USB enumeration).
CONFIG_USE_DT_CODE_PARTITION=y
