# Bisection step 3: shell + SD card + VS1053. Still no Bluetooth.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

CONFIG_SPI=y
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# Same sizing already proven necessary/sufficient in tmp/sd_test for
# FAT + SD-over-SPI; carried over unchanged.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# So a stack overflow shows up as a clear fault message instead of a
# silent crash/reset, if it happens again.
CONFIG_HW_STACK_PROTECTION=y
