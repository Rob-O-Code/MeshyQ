# Bisection step 2: shell + SD card only. Still no Bluetooth, no VS1053.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

CONFIG_SPI=y
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# Default main stack (1024B) and heap (0B) are too small for FAT +
# SD-over-SPI mounting; this was almost certainly a stack overflow.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# So a stack overflow shows up as a clear fault message instead of a
# silent crash/reset, if this happens again.
CONFIG_HW_STACK_PROTECTION=y
